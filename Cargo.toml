[workspace]
members = [
    "crates/cargo-cop",
    "crates/cop-model",
    "crates/cop-config",
    "crates/cop-cargo",
    "crates/cop-syntax",
    "crates/cop-analysis",
    "crates/cop-rules",
    "crates/cop-report",
    "crates/cop-i18n",
]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.75"
version = "0.1.1"
license = "MIT OR Apache-2.0"
authors = ["Shao G. <shaogme@gmail.com>"]
repository = "https://github.com/shaogme/cargo-cop"
homepage = "https://github.com/shaogme/cargo-cop"
keywords = ["cargo", "rust", "static-analysis"]
categories = ["development-tools"]

[workspace.dependencies]
clap = { version = "=4.5.53", features = ["derive"] }
cop-model = { path = "crates/cop-model", version = "0.1.1" }
cop-config = { path = "crates/cop-config", version = "0.1.1" }
cop-cargo = { path = "crates/cop-cargo", version = "0.1.1" }
cop-syntax = { path = "crates/cop-syntax", version = "0.1.1" }
cop-analysis = { path = "crates/cop-analysis", version = "0.1.1" }
cop-rules = { path = "crates/cop-rules", version = "0.1.1" }
cop-report = { path = "crates/cop-report", version = "0.1.1" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
cop-i18n = { path = "crates/cop-i18n", version = "0.1.1" }
