name: 发布 cargo-cop

on:
  workflow_dispatch:
    inputs:
      version:
        description: cargo-cop 的 Cargo 包版本（不含 v 前缀）
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: 构建 ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-26.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-26-intel
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: 校验发布版本
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          package_version="$(cargo pkgid --package cargo-cop | sed 's/^.*[#@]//')"
          if [[ "$RELEASE_VERSION" != "$package_version" ]]; then
            echo "输入版本 $RELEASE_VERSION 与 cargo-cop 版本 $package_version 不一致" >&2
            exit 1
          fi

      - name: 构建发布二进制
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: cargo build --locked --release --package cargo-cop --target "$TARGET"

      - name: 打包 Unix 发布产物
        if: runner.os != 'Windows'
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          package_dir="cargo-cop-${TARGET}-v${RELEASE_VERSION}"
          mkdir -p "$package_dir"
          cp "target/${TARGET}/release/cargo-cop" "$package_dir/cargo-cop"
          tar -czf "${package_dir}.tgz" "$package_dir"

      - name: 打包 Windows 发布产物
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          TARGET: ${{ matrix.target }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          $packageDir = "cargo-cop-$($env:TARGET)-v$($env:RELEASE_VERSION)"
          New-Item -ItemType Directory -Path $packageDir | Out-Null
          Copy-Item "target/$($env:TARGET)/release/cargo-cop.exe" "$packageDir/cargo-cop.exe"
          Compress-Archive -Path $packageDir -DestinationPath "$packageDir.zip"

      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.target }}
          path: |
            cargo-cop-*.tgz
            cargo-cop-*.zip
          if-no-files-found: error
          retention-days: 1

  publish:
    name: 创建 GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: release-*
          merge-multiple: true

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ inputs.version }}
          target_commitish: ${{ github.sha }}
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
